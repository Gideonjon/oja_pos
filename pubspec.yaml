name: oja_pos
description: "Oja POS: a market point-of-sale with Lightning, card/transfer and bill payments."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Package dependencies are added by ../setup.sh (flutter pub add ...), which
# resolves the newest versions compatible with your Flutter SDK.
dependencies:
  cloud_firestore: ^7.2.0
  crypto: ^3.0.8
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.3
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/onboarding/
